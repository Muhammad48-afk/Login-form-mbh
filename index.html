<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Form - MBH</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login">
      <h1>Login</h1>
      <form id="loginForm">
        <div class="input-container">
          <input
            class="username"
            type="text"
            id="username"
            placeholder="Username                                              👤"
            required
          />
        </div>

        <br />

        <input
          class="password"
          type="password"
          id="password"
          placeholder="Password                                              🔑"
          required
        />

        <br />

        <button type="submit" class="btn">Login</button>
      </form>

      <br />

      <!-- Install App Button -->
      <button id="installApp" class="btn">Install App</button>
    </div>

    <script src="install.js"></script>
  </body>
</html>
